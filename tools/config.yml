# Retro Hardware Database — configuration
# Edit this, then re-run the scripts. Nothing here is secret, so it's safe in a public repo.

# Base URL of the REST API the ported scripts read/write (the single source of
# truth). Override per-run with RHDB_API or --api. On the printer/reader box,
# point this at the API host on the LAN, e.g. http://192.168.1.2:8000
api_url: "http://localhost:8000"

# If the API requires HTTP Basic auth, put the credentials here (or better, set
# RHDB_AUTH_USER / RHDB_AUTH_PASSWORD in the environment). Blank = no auth.
auth_user: ""
auth_password: ""

# The public base URL of the app. This is what the QR codes encode, so set it
# correctly BEFORE printing labels.
base_url: "https://db.2600.me"

# Label settings (6 x 4 by default — change units to "mm" for 152 x 102 mm, etc.)
label:
  width: 6
  height: 4
  # units: "in" or "mm"
  units: "in"
  # QR error-correction: L, M, Q, or H
  qr_error: "M"
  # rotate the printed label by this many degrees (0/90/180/270); flip to 270 if upside down
  rotate: 90
  # Optional TTF display font for the asset number + title on labels.
  # Drop the file at this path; if it's missing, labels fall back to Helvetica.
  font_path: "assets/fonts/Audiowide-Regular.ttf"

# Smaller label: QR + asset number + make/model only (e.g. a 19 x 51 mm Dymo).
# Used with:  python make_labels.py --small RH-0001
label_small:
  width: 51
  height: 19
  units: "mm"
  qr_error: "M"
  # rotate the printed label by this many degrees (0/90/180/270); flip to 270 if upside down
  rotate: 90
  # safe margin (mm) kept clear at each end so the printer doesn't clip the text
  safe_mm: 3

# Printing — macOS `lp` (CUPS). List your printers with:  lpstat -p
# Set small_printer to your label printer's name (blank = system default).
print:
  copies: 1
  small_printer: "DYMO_LabelWriter_450_Turbo"
  full_printer: "DYMO_LabelWriter_4XL"
