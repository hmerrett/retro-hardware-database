<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Retro Hardware Database has moved</title>
<style>
  html{color-scheme:light dark}
  body{font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
       margin:0;min-height:100vh;display:grid;place-items:center;
       background:#f5f5f3;color:#1b1e23}
  @media (prefers-color-scheme:dark){body{background:#0f1115;color:#e8eaed}}
  main{max-width:34rem;padding:2rem;text-align:center}
  a{color:#0c8f57}
  @media (prefers-color-scheme:dark){a{color:#36c98d}}
  p{margin:.5rem 0}
</style>
<script>
  // Any /items/<asset-id>/ URL from a printed label follows to the live app,
  // including ids that were never published here; anything else goes home.
  (function(){
    var m = location.pathname.match(/\/items\/([A-Za-z0-9-]+)\/?$/);
    location.replace("https://db.2600.me" + (m ? "/items/" + m[1] : "/"));
  })();
</script>
</head>
<body>
<main>
<h1>The Retro Hardware Database has moved</h1>
<p>It is now a live catalogue at <a href="https://db.2600.me">https://db.2600.me</a>.</p>
</main>
</body>
</html>
