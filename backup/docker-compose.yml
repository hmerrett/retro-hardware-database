# Runs on the machine that should hold the off-site copy, not on the server.
#
#   cp .env.example .env     and fill it in
#   docker compose run --rm backup check      one-off, proves the setup works
#   docker compose up -d                      nightly from then on
services:
  backup:
    build: .
    restart: unless-stopped
    environment:
      RHDB_HOST: ${RHDB_HOST:?set RHDB_HOST in .env}
      RHDB_DIR: ${RHDB_DIR:-/root/retro-hardware-database}
      RHDB_IMAGES: ${RHDB_IMAGES:-/var/lib/docker/volumes/retro-hardware-database_images/_data}
      RHDB_FILES: ${RHDB_FILES:-/var/lib/docker/volumes/retro-hardware-database_files/_data}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      TZ: ${TZ:-Europe/London}
      INCLUDE_ENV: ${INCLUDE_ENV:-1}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-5}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-12}
      KEEP_YEARLY: ${KEEP_YEARLY:-3}
      # /repo is the mounted directory below. Point this at sftp:user@nas:/path or
      # s3:... instead if you would rather restic talk to the NAS directly than go
      # through a mount -- everything else works the same.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repo}
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      STAGE: /stage
    volumes:
      # The backup itself: put this on the NAS.
      - ${BACKUP_DIR:-./data}/repo:/repo
      # A mirror of the server, so each night only transfers what changed. It can
      # live on local disk even when the repository is on the NAS -- losing it
      # costs one slow night, not any history.
      - ${STAGE_DIR:-${BACKUP_DIR:-./data}/stage}:/stage
      # Read-only: the key that reaches the server, and the repository password.
      - ${SSH_KEY:-./secrets/id_ed25519}:/root/.ssh/id_ed25519:ro
      - ${RESTIC_PASSWORD_FILE:-./secrets/restic-password}:/run/secrets/restic-password:ro
