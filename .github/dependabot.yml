# Weekly, grouped, and three ecosystems rather than one: the lockfile is only half
# the supply chain. workflow-and-ci says this file exists, which until now it did
# not -- the rule was written for the intent and the intent never landed.
version: 2
updates:
  # The application's dependencies, from api/uv.lock, and the tool server's, from
  # mcp/uv.lock. Grouped into one pull request a week: fourteen separate bumps is
  # fourteen CI runs and fourteen reviews of the same kind of change.
  - package-ecosystem: uv
    directories: ["/api", "/mcp"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The images the two builds are made of -- the Python base images and the pinned uv.
  - package-ecosystem: docker
    directories: ["/api", "/mcp"]
    schedule:
      interval: weekly
  # And the actions CI and a release run, which are code from other people on every
  # push. The release's are pinned to commits, and these PRs move the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
