name: Deploy site

# The site is now built from the REST API on a LAN machine (which GitHub's CI
# cannot reach) and committed to site/ by tools/publish.sh in the
# retro-hardware-db-2 repo. This workflow just deploys that committed folder.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
