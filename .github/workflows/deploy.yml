name: Deploy site

# The catalogue lives at https://db.2600.me now. site/ is a set of redirect
# stubs that keep every already-printed QR label resolving, so it changes only
# if those stubs do. This workflow just deploys that committed folder.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
