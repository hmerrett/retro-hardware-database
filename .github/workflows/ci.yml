name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One engine end to end: the suite runs against MariaDB (what production uses)
  # and builds its schema by running the real migrations, so every run also proves
  # the migrations reach head from empty and match the models. MariaDB's DDL
  # auto-commits, so a migration that fails partway leaves a half-applied schema --
  # exactly how a data-cleanup step once broke every fresh install.
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: retro
          MARIADB_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      # The lockfile is the whole dependency tree, so `--frozen` means this run
      # installs what was reviewed rather than resolving something newer on the
      # day (backend-standards). uv is pinned for the same reason the Dockerfile
      # pins it.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install
        run: uv sync --project api --all-groups --frozen
      - name: Lint
        run: uv run --project api ruff check .
      # The formatter is the other half of the same tool, and checking it here is
      # what makes layout something nobody argues about in review: the settings are
      # the ones already in pyproject.toml, so the only change is that they stopped
      # being optional.
      - name: Format
        run: uv run --project api ruff format --check .
      # Run from api/, because that is where mypy looks for its settings. Strict,
      # except for the modules pyproject.toml names as not there yet -- a list that
      # only shrinks, so a new module is held to strict by not being on it.
      - name: Types
        run: uv run --directory api mypy app
      # The backup round-trip test dumps and restores through MariaDB's own
      # client (mariadb-dump/mariadb) -- the family production uses. The runner
      # ships Oracle MySQL 8's mysqldump, whose default column-statistics query
      # hits a table MariaDB has no equivalent of and fails against the MariaDB
      # service; install MariaDB's client so the test uses the matching tool.
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Test
        env:
          DATABASE_URL: mysql+pymysql://root:rootpw@127.0.0.1:3306/retro
          MIGRATION_TEST_DATABASE_URL: mysql+pymysql://root:rootpw@127.0.0.1:3306/
        run: uv run --project api pytest
      # Fails the build if a locked runtime dependency has a known vulnerability.
      # The export is the runtime half of the lock -- the whole transitive tree,
      # not the fourteen names in pyproject.toml, which is what the move to uv
      # bought. If it ever blocks unrelated work, bump the offending pin -- or move
      # this to a scheduled run.
      - name: Audit dependencies
        run: |
          uv export --project api --frozen --no-dev --no-emit-project \
            | uv run --project api pip-audit --requirement /dev/stdin
