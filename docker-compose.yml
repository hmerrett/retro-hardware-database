# The Compose project name, which prefixes every container and -- the part that
# matters -- every named volume: retro-hardware-database_dbdata and the rest.
#
# Pinned here rather than left to Compose, which otherwise derives it from whatever
# the checkout directory happens to be called. That made the location of the
# database, the photographs and the uploaded files a property of the folder name:
# rename or move the checkout and Compose invents a new project, creates a new set
# of empty volumes, and brings the site up blank with the real data still sitting
# in volumes nothing points at any more. Naming it here means the data stays put
# whatever the directory is called.
name: retro-hardware-database

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-retro}
      MARIADB_USER: ${DB_USER:-retro}
      # Passwords have no default: without them Compose stops with the message
      # below rather than silently bringing the database up on a known password.
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env (see .env.example)}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Runs before the app, as root, and exits: it gives the photograph and file
  # volumes to the user the app runs as (api/fix-volumes.sh). Only an install from
  # before the app stopped running as root needs it -- its volumes are still
  # root's -- and it changes nothing when nothing is wrong. `docker compose ps -a`
  # shows it as exited, which is what finished looks like for this one.
  api-init:
    build: ./api
    user: root
    command: ["./fix-volumes.sh"]
    volumes:
      - images:/app/images
      - files:/app/files

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-retro}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/${DB_NAME:-retro}
      RHDB_BASE_URL: ${RHDB_BASE_URL:-https://${RHDB_DOMAIN:?set RHDB_DOMAIN in .env (see .env.example)}}
      RHDB_AUTH_USER: ${RHDB_AUTH_USER:-}
      RHDB_AUTH_PASSWORD: ${RHDB_AUTH_PASSWORD:-}
      RHDB_SECRET_KEY: ${RHDB_SECRET_KEY:-}
      RHDB_WATERMARK: ${RHDB_WATERMARK:-1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - images:/app/images
      # Drivers, manuals and disk images uploaded beside the register. Its own
      # volume, like the photographs: a rebuild replaces the image, not the data.
      - files:/app/files
      - goaccess_report:/app/stats:ro
      # This installation's own logo, icons and share card, if it has any. Read
      # only: branding is dropped in from outside, never written by the app. A file
      # here is served in place of the one that ships under the same name, and
      # logo-512.png is also what the photo watermark is made from.
      - ./branding:/app/branding:ro
    depends_on:
      db:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      RHDB_AUTH_USER: ${RHDB_AUTH_USER:-}
      RHDB_AUTH_PASSWORD: ${RHDB_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The name this site answers to, and the address Let's Encrypt writes to about
      # its certificates. Both belong to the installation rather than to the code,
      # so the Caddyfile reads them from here -- and both fail fast, because a proxy
      # brought up on somebody else's domain is not a working site.
      RHDB_DOMAIN: ${RHDB_DOMAIN:?set RHDB_DOMAIN in .env (see .env.example)}
      RHDB_ACME_EMAIL: ${RHDB_ACME_EMAIL:?set RHDB_ACME_EMAIL in .env (see .env.example)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Anything this installation adds to the proxy -- other names, a redirect from
      # a domain it used to live at. Not in git: see caddy/conf.d/README.md.
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api

  # Turns Caddy's access log into a self-contained HTML traffic report; the app
  # serves it (login-only) at /traffic.
  #
  # The rolled-over logs go in beside the live one, so the report reaches back as
  # far as Caddy still keeps rather than only to the last roll -- a fortnight of
  # visitors used to vanish from it the moment access.log passed 10MiB. This build
  # of GoAccess has no zlib, so the archives are unpacked here and the whole lot
  # arrives on stdin; the glob is in date order because the roll names are
  # timestamps.
  #
  # That makes every run a run over the entire retained history, tens of seconds
  # of it on this two-core box, which is why the wait between runs is five minutes
  # and not one. The report is built alongside and moved into place, a rename
  # being the one way a reader cannot catch it half-written. It is built under a
  # name ending .html because GoAccess decides what it is writing from the
  # extension and refuses anything but .html, .json or .csv.
  goaccess:
    image: allinurl/goaccess:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -s /logs/access.log ]; then
            { zcat /logs/access-*.log.gz 2>/dev/null; cat /logs/access.log; } \
              | goaccess - -o /report/index-new.html \
                  --log-format=CADDY --html-report-title="${RHDB_DOMAIN} traffic" \
              && mv /report/index-new.html /report/index.html
          fi
          sleep 300
        done
    volumes:
      - caddy_logs:/logs:ro
      - goaccess_report:/report
    depends_on:
      - caddy

volumes:
  dbdata:
  images:
  files:
  caddy_data:
  caddy_config:
  caddy_logs:
  goaccess_report:
