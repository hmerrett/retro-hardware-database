[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
# The code sits a little over the classic 79; 100 is where it actually lands.
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv-test", "tools/.venv", "api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    # A route's parameters are its documentation; splitting them to please a
    # line-length rule would read worse.
    "E501",
    # The multiplication sign and em dash are the display typography this whole
    # catalogue renders in ("2x 5.25in 360K floppy"), not accidents.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures must set the environment before app.db builds the engine, so the
# imports cannot come first.
"api/tests/conftest.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency and upload markers are calls by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query",
                          "fastapi.Form", "fastapi.Path", "fastapi.Body"]
