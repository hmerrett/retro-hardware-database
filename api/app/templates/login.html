{% extends "base.html" %}
{% block title %}Log in — {{ site_name() }}{% endblock %}
{% block content %}
<h2>Log in</h2>
{% if error %}<p class="banner">Incorrect username or password.</p>{% endif %}
<form class="edit login-box" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" autofocus autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <p class="mt-14"><button class="btn primary" type="submit">log in</button></p>
</form>
{% endblock %}
