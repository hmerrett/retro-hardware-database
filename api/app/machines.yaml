        year: 1993
        cpu: Zilog Z80-6
        chassis: clamshell notebook with a backlit LCD and a 3.5-inch drive
        os: BASIC, the organiser and Protext, in ROM
        ram: [128K]
        issues: []
        styles: [NC200]
        chips:
