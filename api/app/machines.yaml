          - socket: denise
            variants: [8373 (Super Denise)]
          - socket: kickstart
            variants: ['2.04']
      - key: amiga-600
        model: Amiga 600
        summary: >-
          A cost-reduced A500 in a compact case with an IDE header and a PCMCIA slot,
          and no numeric keypad — Commodore's attempt at a cheap console-like Amiga that
          pleased almost nobody. The IDE and PCMCIA are genuinely useful now, which has
          quietly turned it into a good machine for modern storage adaptations. Same
          surface-mount capacitor problems as the rest of the late line.
        year: 1992
        cpu: Motorola 68000-7.09
        chassis: 'compact, built-in floppy'
        os: Kickstart 2.05 / Workbench 2.1
        ram: [1MB, 2MB]
        issues: [Rev 1.5]
