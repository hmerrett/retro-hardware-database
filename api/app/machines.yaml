          otherwise
        variants: [Intel 8087, Intel 80287]
    models:
      - key: ibm-5150
        model: PC 5150
        summary: >-
          The original IBM PC, and the machine whose architecture the industry still
          runs on. IBM built it in a year from bought-in parts and published the
          technical reference, including the BIOS listing — which let Compaq and
          everyone after it build compatibles and took the standard out of IBM's hands.
          Cassette port, five slots, and a keyboard that outlasts everything. The
          foundation of the whole platform.
        year: 1981
        cpu: Intel 8088-4.77
        chassis: desktop, five expansion slots, a cassette port nobody used
        os: IBM PC DOS 1.0 / Cassette BASIC in ROM
        ram: [16K, 64K, 256K, 640K]
        issues: [16K-64K planar, 64K-256K planar]
        styles: []
        chips:
          - socket: bios
            label: BIOS ROM
            note: >-
              the date in the ROM is how a board of this age is dated, and the
              three of them are not interchangeable
            variants: [BIOS 04/24/81, BIOS 10/19/81, BIOS 10/27/82]
      - key: ibm-5155
        model: Portable PC 5155
        summary: >-
          IBM's answer to the Compaq Portable, two years late: XT internals in a
          luggable case with a nine-inch amber screen and a fold-up keyboard. Thirty
          pounds of it. It sold poorly against Compaq's own machine, which makes it
          markedly less common than the desktop XT, and it is a striking object.
        year: 1984
        cpu: Intel 8088-4.77
        chassis: luggable with a 9-inch amber CRT, an XT board inside
        os: IBM PC DOS 2.1
        ram: [256K, 640K]
        issues: []
        styles: []
        chips:
          - socket: bios
            label: BIOS ROM
            variants: [BIOS 11/08/82]
      - key: ibm-5160
        model: PC/XT 5160
        summary: >-
          The XT: a hard disc as standard, eight slots and 640K addressable, which is
          the configuration DOS software assumed for the rest of the decade. It is the
          practical original PC — the 5150 is more historic, the XT is more usable — and
          the machine most period expansion cards were designed around. Full-height
          drives and a power supply that will run forever.
        year: 1983
        cpu: Intel 8088-4.77
        chassis: desktop, eight expansion slots, a fixed disk as standard
        os: IBM PC DOS 2.0
        ram: [64K, 256K, 640K]
        issues: [64K-256K planar, 256K-640K planar]
        styles: []
        chips:
          - socket: bios
            label: BIOS ROM
            variants: [BIOS 11/08/82, BIOS 01/10/86, BIOS 05/09/86]
      - key: ibm-5162
        model: PC XT/286 5162
        summary: >-
          The XT/286: an AT-class 286 board in an XT case, and — because it runs zero
          wait state memory — genuinely faster than the 6MHz PC/AT it sat below in the
          price list. IBM quietly withdrew it. That accidental superiority is the whole
          story, and it makes the 5162 an interesting oddity rather than just another
          286.
        year: 1986
        cpu: Intel 80286-6
        chassis: XT case, AT board, no wait states
        os: IBM PC DOS 3.2
        ram: [640K]
        issues: []
        styles: []
        chips:
          - socket: cpu
            variants: [Intel 80286]
          - socket: bios
            label: BIOS ROM
            variants: [BIOS 04/21/86]
      - key: ibm-5170
        model: PC/AT 5170
        summary: >-
          The machine that set the shape of every PC since: the AT introduced the 16-bit
          ISA slot, the 84-key layout that became the enhanced keyboard, the 1.2MB
          floppy and the battery-backed CMOS clock. Its 80286 brought protected mode to
          the desk, though DOS never used it. Built like a safe, with a front keylock
          and a power supply that will outlive its owner. The type 1 board at 6MHz is
          the earlier and scarcer of the two.
        year: 1984
        cpu: Intel 80286-6
        chassis: desktop, eight slots, a key lock on the front
        os: IBM PC DOS 3.0
        ram: [256K, 512K, 640K]
        issues:
