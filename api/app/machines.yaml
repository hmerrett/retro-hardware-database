  - key: ibm-pc
    name: IBM PC
    manufacturer: IBM
    regions: [US, UK, Europe]
    chips:
      - socket: cpu
        label: CPU
        variants: [Intel 8088, Intel 8088-2, NEC V20, Intel 80286, Intel 80C88]
