        model: Portable 386
        summary: >-
          The Portable III chassis with a 386DX, which in 1988 made it one of the
          fastest computers you could buy at any size, let alone one with a handle. The
          plasma screen again, and the same heat. Expensive when new and consequently
          uncommon now.
        year: 1988
        cpu: Intel 80386DX-20
        chassis: the Portable III shell with a 386 in it
