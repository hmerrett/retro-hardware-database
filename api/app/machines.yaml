            variants: [Motorola DSP56001]
          - socket: tos
            variants: [TOS 4.01, TOS 4.02, TOS 4.04]
      - key: atari-mega-st
        model: Mega ST
        summary: >-
          The ST as a professional tool: a low desktop box with a detachable keyboard, a
          blitter in later units, and an internal expansion bay, sold for desktop
          publishing and music. Calamus and the SLM laser printer turned these into
          serious typesetting machines in Germany, where the Mega ST had a following the
          rest of the range never matched.
        year: 1987
        cpu: Motorola 68000-8
        chassis: desktop with a detachable keyboard
        os: TOS 1.02 / GEM
        ram: [1MiB, 2MiB, 4MiB]
        issues: []
        styles: [Mega ST 1, Mega ST 2, Mega ST 4]
        chips:
