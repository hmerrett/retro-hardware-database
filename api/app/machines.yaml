    models:
      - key: atari-520st
        model: 520ST
        summary: >-
          Built in under a year by Tramiel's Atari to beat the Amiga to market, and it
          did: a 68000 with a GEM desktop for well under a thousand dollars in 1985. The
          MIDI ports fitted as standard are the historically important detail — they
          made the ST the standard studio sequencer machine for a decade, and Cubase and
          Notator were written for it. Earliest boards have external power bricks.
        year: 1985
        cpu: Motorola 68000-8
        chassis: wedge, external floppy drive
        os: TOS 1.00 / GEM
        ram: [512K]
        issues: []
        styles: [520ST (TOS on disk), 520ST+ (1MB)]
        chips:
          - socket: tos
            variants: [TOS 1.00 (on disk), TOS 1.00, TOS 1.02]
      - key: atari-520ste
        model: 520STE
        summary: >-
          The enhanced ST: a blitter for faster graphics, a 4096-colour palette,
          hardware scrolling and stereo DMA sound. On paper it answers the Amiga
          properly. In practice a good deal of ST software was written for the plain
          machine and does not use — or sometimes does not tolerate — the new hardware,
          which is why the STE has a mixed reputation and a devoted demo scene.
        year: 1989
        cpu: Motorola 68000-8
        chassis: wedge, built-in floppy
        os: TOS 1.62 / GEM
        ram: [512K, 1MiB, 4MiB]
        issues: []
        styles: [520STE]
        chips:
          - socket: blitter
            label: Blitter
            variants: [C025972]
          - socket: psg
            variants: [Yamaha YM2149F]
          - socket: tos
            variants: [TOS 1.62, TOS 2.06]
      - key: atari-520stfm
        model: 520STFM
        summary: >-
          The ST as most people owned it: floppy drive and modulator both built in,
          512K, one box. This is the volume machine of the European ST market and the
          one the games were written against. The internal single-sided drives were
          later replaced by double-sided; which one is fitted decides what disc images
          will run.
        year: 1986
        cpu: Motorola 68000-8
        chassis: 'wedge, built-in floppy'
        os: TOS 1.02 / GEM
        ram: [512K, 1MB]
        issues: []
        styles: [520STFM, 520STM (no drive)]
      - key: atari-520stm
        model: 520STM
        summary: >-
          The 520ST with the RF modulator fitted, so it works on a television rather
          than needing Atari's monitor. A small change that matters enormously for what
          the machine could be sold as at home. Otherwise the launch ST: 512K, external
          floppy, and the same MIDI ports.
        year: 1985
        cpu: Motorola 68000-8
        chassis: wedge, external floppy drive
        os: TOS 1.02 / GEM
        ram: [512K, 1MiB]
        issues: []
        styles: [520STM, 260ST]
      - key: atari-1040ste
        model: 1040STE
        summary: >-
          The STE with a megabyte fitted — the best of the 16MHz-and-under STs and the
          one to buy if you want the blitter and the stereo sound with enough memory to
          use them. Same compatibility caveats as any STE: some early software objects
          to the new hardware.
        year: 1989
        cpu: Motorola 68000-8
        chassis: 'wedge, built-in floppy'
        os: TOS 1.62 / GEM
        ram: [1MB, 4MB]
        issues: []
        styles: [1040STE]
        chips:
          - socket: blitter
            label: Blitter
            note: >-
              standard on the STE, an option on an ST
            variants: [C025972]
          - socket: psg
            variants: [Yamaha YM2149F]
          - socket: tos
            variants: [TOS 1.62, TOS 2.06]
      - key: atari-1040stf
        model: 1040STF
        summary: >-
          A megabyte and a double-sided drive as standard, which is what the ST needed
          to be a working machine rather than a games console: desktop publishing, MIDI
          sequencing and serious software all assume this specification. The most useful
          of the classic STs, and common enough to be affordable.
        year: 1986
        cpu: Motorola 68000-8
        chassis: 'wedge, built-in floppy'
        os: TOS 1.02 / GEM
        ram: [1MB]
        issues: []
        styles: [1040STF, 1040STFM]
      - key: atari-falcon030
        model: Falcon030
        summary: >-
          The last Atari computer, and the most interesting: a 68030 with a Motorola
          56001 DSP on the board, true colour video and eight-track direct-to-disc
          recording. It turned into a serious music workstation and still has an active
          following for exactly that reason. Atari cancelled it within two years to
          concentrate on the Jaguar. Sought after, and often found heavily upgraded.
        year: 1992
        cpu: Motorola 68030-16
        chassis: wedge, one-piece
