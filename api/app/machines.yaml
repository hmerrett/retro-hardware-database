        model: Portable Plus
        summary: >-
          The Portable with an internal hard disc, which in 1983 meant a 10MB drive
          shock-mounted in a machine designed to be carried — not an obvious
          combination. It made the luggable a genuine desktop replacement. Same
          excellent build as the Portable, and the drive is usually what has failed.
        year: 1983
        cpu: Intel 8088-4.77
        chassis: the Portable with a 10MB fixed disk where the second drive was
