# The catalogue of machines this register knows as models: home computers,
# consoles, and the branded PCs that were sold under a model name. A
# whitebox clone is not in here and never will be --
# it is described by the parts in it, which is all there is to say about it.
#
# ---------------------------------------------------------------------------
# ADDING A MACHINE
# ---------------------------------------------------------------------------
#
# You do not need to know any programming to edit this file. It is a list, and
# the only rule that really matters is that things line up: a line's indentation
# is what says which machine it belongs to. Use spaces, never tabs.
#
# Find the family your machine belongs to (Sinclair, Commodore, Sharp, MSX...)
# and copy the model above it as a starting point. If its maker is not here at
# all, copy a whole family instead. Then correct the values.
#
# A model looks like this, and only the first three lines are compulsory:
#
#       - key: oric-atmos          <- the permanent name. See the warning below.
#         model: Atmos             <- what to call it. NOT "Oric Atmos": the
#                                     maker is written separately, so putting it
#                                     here would file the machine as "Oric Oric
#                                     Atmos". The two are joined for you.
#         summary: >-              <- optional. What makes this model worth
#           Oric's answer to...       holding: what it did that its neighbours
#                                     did not, what a collector would look for.
#                                     Around 75 words. Leave it out rather than
#                                     guess -- an invented significance is worse
#                                     than none, and the pages that show it fall
#                                     back to the specs.
#         year: 1984               <- the year that model appeared
#         manufacturer: Oric       <- only if it differs from the family's
#         cpu: MOS 6502A-1         <- maker, part, MHz, the way the CPU box wants
#         chassis: wedge, white case
#         os: Oric Extended BASIC
#         ram: [48K]               <- the sizes it was sold with. Write them as
#                                     16K, 128K, 1MiB; the register reads those
#                                     back, and refuses a size it cannot.
#         issues: [Issue 1]        <- board revisions, as the maker marked them
#         styles: [Atmos]          <- what tells two of them apart across the
#                                     room: rubber or moulded keys, a silver or
#                                     a rainbow label, a heavy sixer
#         chips:                   <- one entry per socket worth recording
#           - socket: psg          <- the permanent name for the socket
#             label: Sound         <- what the page and the form call it. Leave
#                                     it out and the socket name is tidied up
#                                     instead, so 'cpu' shows as 'CPU'.
#             note: >-             <- optional, and shown beside the question.
#               why anyone would care which one is in there
#             variants: [General Instrument AY-3-8912]
#
# Anything you leave out is simply not asked about. Anything you get wrong stops
# the register from starting, and the message says which family, which model and
# which field -- so if the site does not come back up after an edit, read it.
#
# ---------------------------------------------------------------------------
# THE THINGS TO BE CAREFUL ABOUT
# ---------------------------------------------------------------------------
#
# KEYS ARE FOREVER. `key:` is the one thing a real machine's record stores. Every
# other word here -- a name, a label, a note, a chip's part number -- can be
# corrected whenever, and every machine filed under it picks the correction up.
# Change a key and the machines filed under the old one are orphaned, and only a
# database migration puts them back. Pick a key, keep it.
#
# THESE LISTS ARE THE COMMON CASES, NOT AN INVENTORY. Every list here is offered
# as a set of buttons with a "custom" box beside them, so a board nobody has
# written up or a chip swapped in a repair is recorded by typing it. Better
# still, what is typed once is offered ever after: the register adds it to the
# buttons for that model by itself. So there is no need to chase completeness --
# put down what turns up, and let the rest arrive.
#
# ONE THING SAID ONCE. The maker goes in `manufacturer:`, at the family or on the
# model, and never in `model:` as well.
#
# ---------------------------------------------------------------------------
# TWO SHORTCUTS
# ---------------------------------------------------------------------------
#
# SHARED LISTS. Where the same part numbers turn up in machine after machine,
# they are written once under `lists:` at the top and named afterwards:
#
#     variants: z80          instead of the eight Z80 markings written out
#
# You can name a shared list anywhere a list is expected -- variants, styles,
# issues, regions.
#
# A FAMILY'S SOCKETS ARE EVERY MODEL'S. A `chips:` block on the family is asked
# of every model in it, so the Z80 is written once for all the Spectrums. A model
# can then say something different about one socket without repeating the rest:
#
#     chips:
#       - socket: ula
#         variants: [Amstrad 40056]     <- this model has a different part
#       - socket: sid
#         variants: []                  <- this model hasn't got that socket
#
# An empty `variants:` list is how a machine says it has not got one: it is why a
# VIC-20 is not asked about its SID and a ZX80 is not asked about its ULA.
#
# ---------------------------------------------------------------------------
#
# WHERE ORDER MATTERS. Families are offered in alphabetical order of who made
# them, whatever order this file lists them in -- so a new family can go wherever
# is convenient and will still land in the right place in the menu. This file is
# kept in that order too, just so it is easy to read.
#
# A family's machines are sorted by name for the same reason, so one slotted in
# beside the machine you copied still comes out in the right place. Numbers in a
# name count as numbers, so an Amiga 500 comes before an Amiga 1000.
#
# What you write in order stays in order in one place: a model's chip sockets are
# asked as you list them, so put them in the order you read the board.

lists:
  z80:
    - Zilog Z80A
    - Zilog Z8400AB1
    - NEC D780C-1
    - SGS Z8400AB1
    - Sharp LH0080A
    - Mostek MK3880N-4
    - GoldStar Z8400A
    - Toshiba TMPZ84C00AP
  ay:
    - General Instrument AY-3-8912
    - General Instrument AY-3-8910
    - Yamaha YM2149F

families:
  - key: acorn
    name: Acorn
    manufacturer: Acorn
    regions: [PAL (UK)]
    chips:
      - socket: cpu
        label: CPU
        variants: [Rockwell R6502A, Synertek SY6502A, MOS 6502A]
      - socket: video-ula
        label: Video ULA
        note: >-
          the ULA that fails and takes the display with it; VIDPROC is the modern
          stand-in
        variants: [Ferranti 5C022E, VideoProc (VIDPROC)]
      - socket: serial-ula
        label: Serial ULA
        note: >-
          the cassette and RS423 side, and the other ULA that fails
        variants: [Ferranti 2C199E]
      - socket: crtc
        label: CRTC
        variants: [Hitachi HD6845, Motorola MC6845, Synertek SY6845]
      - socket: fdc
        label: Floppy controller
        note: >-
          the 8271 of an early board, the 1770 of a later one, or an empty socket
          on a machine sold without discs
        variants: [Intel 8271, WD1770, WD1772, none fitted]
      - socket: os-rom
        label: OS ROM
        variants: [OS 0.10, OS 1.00, OS 1.20, OS 2.00 (B+), MOS 3.20, MOS 3.50]
      - socket: basic-rom
        label: BASIC ROM
        variants: [BASIC I, BASIC II, BASIC IV]
    models:
      - key: acorn-a4
        model: A4
        summary: >-
          The first ARM laptop. Acorn folded an ARM3 at 24MHz and RISC OS 3.11 into a
          clamshell with a mono LCD in 1992, years before anybody else shipped a
          portable RISC machine. Expensive, made in small numbers, and now genuinely
          rare — the screens and the batteries are the usual casualties. A landmark
          given what ARM laptops eventually became.
        year: 1992
        cpu: Acorn ARM3-24
        chassis: laptop with a mono LCD
        os: RISC OS 3.11
        ram: [2MiB, 4MiB]
        issues: []
        styles: [A4]
        chips:
          - socket: cpu
            variants: [Acorn ARM3]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: os-rom
            variants: [RISC OS 3.11]
      - key: acorn-a3010
        model: A3010
        summary: >-
          Acorn's last serious attempt at the British home market: an ARM250 — the ARM2
          with the memory, video and I/O controllers folded into one chip — in the
          A3000's wedge case, sold through high-street shops with a joystick port and a
          games bundle. It did not work; the Amiga and the PC had the market. As
          hardware the ARM250 integration is the point, and it makes the machine simple
          and reliable.
        year: 1992
        cpu: Acorn ARM250-12
        chassis: 'wedge, one-piece'
        os: RISC OS 3.10
        ram: [1MB, 2MB, 4MB]
        issues: []
        styles: [A3010, A3020]
        chips:
          - socket: cpu
            note: >-
              the ARM250 has the MEMC, VIDC and IOC inside it, so there are no
              separate chips to record
            variants: [Acorn ARM250]
          - socket: os-rom
            variants: [RISC OS 3.10, RISC OS 3.11]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
      - key: acorn-a3020
        model: A3020
        summary: >-
          The A3010's school-and-office sibling: the same ARM250 wedge with an internal
          hard disc bay and a proper network socket for Acorn's Econet. Sold into
          education where the A3000 had been, and the version most likely to turn up
          with period software still on the drive. Fitted machines are more useful than
          A3010s and no harder to find.
        year: 1992
        cpu: Acorn ARM250-12
        chassis: wedge, one-piece, with a built-in drive
        os: RISC OS 3.11
        ram: [2MiB, 4MiB]
        issues: []
        styles: [A3020, A3020 with a hard disk]
        chips:
          - socket: cpu
            note: >-
              the ARM250 has the MEMC, VIDC and IOC inside it, so there are no
              separate chips to record
            variants: [Acorn ARM250]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: os-rom
            variants: [RISC OS 3.10, RISC OS 3.11]
      - key: acorn-a4000
        model: A4000
        summary: >-
          The A3020's boards in a separate desktop case with a detachable keyboard, for
          buyers who wanted an Archimedes that looked like a workstation rather than a
          home computer. Mechanically the most conventional of the ARM250 machines and
          the easiest to work in. Uncommon, having sold in far smaller numbers than the
          wedges either side of it.
        year: 1992
        cpu: Acorn ARM250-12
        chassis: two-box desktop
        os: RISC OS 3.11
        ram: [2MiB, 4MiB]
        issues: []
        styles: [A4000, A4000 Home Office]
        chips:
          - socket: cpu
            variants: [Acorn ARM250]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: os-rom
            variants: [RISC OS 3.10, RISC OS 3.11]
      - key: acorn-a5000
        model: A5000
        summary: >-
          The professional Archimedes: ARM3 at 25MHz, RISC OS 3, a high-density floppy
          and IDE on the board. It is the fastest and best-equipped of the classic
          Archimedes line before the Risc PC changed the shape of the range, and the one
          to have if you want a period ARM desktop that is genuinely pleasant to use
          rather than merely historically interesting.
        year: 1991
        cpu: Acorn ARM3-25
        chassis: two-box desktop
        os: RISC OS 3.00
        ram: [2MiB, 4MiB]
        issues: []
        styles: [A5000, A5000 Alpha (33MHz)]
        chips:
          - socket: cpu
            variants: [Acorn ARM3]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772, Intel 82C710]
          - socket: memc
            label: MEMC
            variants: [MEMC1a]
          - socket: vidc
            label: VIDC
            variants: [VIDC1a]
          - socket: ioc
            label: IOC
            variants: [IOC]
          - socket: os-rom
            variants: [RISC OS 3.00, RISC OS 3.10, RISC OS 3.11]
      - key: acorn-a7000
        model: A7000
        summary: >-
          Named like a Risc PC and built like neither: an ARM7500 with the video, sound
          and I/O on the processor die, in a cost-reduced case for the education market.
          The integration makes it the simplest RISC OS machine of the period and the
          cheapest way into one, at the cost of the expandability the Risc PC was sold
          on. A useful, unglamorous machine that schools bought by the trolley.
        year: 1995
        cpu: Acorn ARM7500-32
        chassis: two-box desktop
        os: RISC OS 3.60
        ram: [4MiB, 8MiB]
        issues: []
        styles: [A7000, A7000+]
        chips:
          - socket: cpu
            variants: [Acorn ARM7500]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [Intel 82C710]
          - socket: os-rom
            variants: [RISC OS 3.60, RISC OS 3.71]
      - key: acorn-a310
        model: Archimedes A310
        summary: >-
          One of the first ARM machines anybody could buy. The 1987 Archimedes launch
          put Acorn's own 32-bit processor — designed in-house because nothing on the
          market was good enough — into a desktop computer running Arthur, later RISC
          OS. It was faster than anything at the price and had almost no software. The
          significance is hard to overstate: every ARM core shipped since traces to this
          design.
        year: 1987
        cpu: Acorn ARM2-8
        chassis: two-box desktop
        os: Arthur 1.20 / RISC OS 2
        ram: [512K, 1MiB, 4MiB]
        issues: []
        styles: [A305, A310, A410/1, A440]
        chips:
          - socket: cpu
            variants: [Acorn ARM2, Acorn ARM3 (upgrade)]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: basic-rom
            variants: []
          - socket: memc
            label: MEMC
            variants: [MEMC1, MEMC1a]
          - socket: vidc
            label: VIDC
            variants: [VIDC1, VIDC1a]
          - socket: ioc
            label: IOC
            variants: [IOC]
          - socket: os-rom
            variants: [Arthur 1.20, RISC OS 2.00, RISC OS 3.10, RISC OS 3.11]
      - key: acorn-a440
        model: Archimedes A440/1
        summary: >-
          The top of the 1987 Archimedes launch: 4MB of memory and a hard disc when the
          A310 had half a megabyte and floppies, aimed at technical and publishing work
          rather than schools. Expensive at the time and consequently uncommon now. The
          interest is the same as the A310's — early ARM2, and Acorn's argument that a
          British RISC design could beat the American 68000s — with the specification
          the argument deserved.
        year: 1987
        cpu: Acorn ARM2-8
        chassis: two-box desktop with a hard disk
        os: Arthur 1.20 / RISC OS 2
        ram: [1MiB, 2MiB, 4MiB]
        issues: []
        styles: [A410/1, A420/1, A440, A440/1]
        chips:
          - socket: cpu
            variants: [Acorn ARM2, Acorn ARM3 (upgrade)]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: memc
            label: MEMC
            variants: [MEMC1, MEMC1a]
          - socket: vidc
            label: VIDC
            variants: [VIDC1, VIDC1a]
          - socket: ioc
            label: IOC
            variants: [IOC]
          - socket: os-rom
            variants: [Arthur 1.20, RISC OS 2.00, RISC OS 3.11]
      - key: acorn-a3000
        model: Archimedes A3000
        summary: >-
          The Archimedes that schools actually bought: one wedge case with the keyboard
          built in, priced for an education budget, and consequently the most common ARM
          machine of its generation in Britain. If you used a computer in a British
          classroom around 1990 it was probably this. Same ARM2 as the A310 in a cheaper
          package, and the case design that Acorn reused for the A3010 that followed it.
        year: 1989
        cpu: Acorn ARM2-8
        chassis: 'wedge, one-piece'
        os: RISC OS 2.00
        ram: [1MB, 2MB, 4MB]
        issues: []
        styles: [A3000]
        chips:
          - socket: cpu
            variants: [Acorn ARM2, Acorn ARM3 (upgrade)]
          - socket: memc
            label: MEMC
            variants: [MEMC1a]
          - socket: vidc
            label: VIDC
            variants: [VIDC1a]
          - socket: ioc
            label: IOC
            variants: [IOC]
          - socket: os-rom
            variants: [RISC OS 2.00, RISC OS 3.00, RISC OS 3.10, RISC OS 3.11]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: basic-rom
            variants: []
          - socket: fdc
            variants: [WD1772]
      - key: acorn-atom
        model: Atom
        summary: >-
          Acorn's first complete computer, sold as a kit or built, and the machine that
          got the company into the room for the BBC contract. A 6502 with Acorn's own
          BASIC in ROM, expandable to floating point and colour, in a wedge case with a
          real keyboard when rivals offered calculator keys. Most interesting as the
          direct ancestor of the Proton prototype that became the BBC Micro, and as
          evidence of how quickly Acorn moved between 1980 and 1981.
        year: 1980
        cpu: MOS 6502-1
        chassis: white and blue case, integrated keyboard
        os: Atom BASIC
        ram: [2K, 12K]
        issues: []
        styles: [Atom (kit-built), Atom (factory-built)]
        chips:
          - socket: cpu
            variants: [MOS 6502, Synertek SY6502]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: fdc
            variants: [Intel 8271, none fitted]
          - socket: os-rom
            label: MOS ROM
            variants: [Atom MOS]
          - socket: basic-rom
            variants: [Atom BASIC]
          - socket: vdg
            label: Video (VDG)
            note: >-
              the same display chip a Dragon and a Tandy CoCo have; the ULA that
              makes a BBC's picture was still two years off
            variants: [Motorola MC6847]
      - key: bbc-master-128
        model: BBC Master 128
        summary: >-
          The BBC Micro finished properly. 128K, the 65SC12 processor, a numeric keypad,
          the 1770 controller, and the ROM software — View, Viewsheet, ADFS, Terminal —
          built in rather than bought as chips. It is the machine the Model B should
          have been by 1986, and the one that stayed in British schools until the
          Archimedes replaced it. Watch the battery: leaking CMOS cells have destroyed a
          great many Master boards.
        year: 1986
        cpu: Rockwell 65SC12-2
        chassis: beige case with keypad
        os: Acorn MOS 3.20
        ram: [128K]
        issues: []
        styles: [Master 128, Master Compact]
        chips:
          - socket: cpu
            variants: [Rockwell R65SC12, GTE G65SC12]
          - socket: fdc
            variants: [WD1770, WD1772]
          - socket: os-rom
            variants: [MOS 3.20, MOS 3.50]
          - socket: basic-rom
            variants: [BASIC IV]
      - key: bbc-master-compact
        model: BBC Master Compact
        summary: >-
          The Master unbundled into three boxes — keyboard, monitor, drive — and aimed
          at the home rather than the classroom. Cheaper than a Master 128 and with a
          3.5-inch drive when the rest of the platform was still on 5.25, which makes it
          the odd one out in the family and the awkward one to find media for. The least
          common Master, and the last BBC-badged machine Acorn made.
        year: 1986
        cpu: Rockwell 65SC12-2
        chassis: slim keyboard unit with a separate monitor
        os: Acorn MOS 5.00
        ram: [128K]
        issues: []
        styles: [Master Compact, Master Compact (with monitor)]
        chips:
          - socket: cpu
            variants: [Rockwell R65SC12, GTE G65SC12]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: fdc
            variants: [WD1772]
          - socket: os-rom
            variants: [MOS 5.00]
          - socket: basic-rom
            variants: [BASIC IV]
      - key: bbc-model-a
        model: BBC Micro Model A
        summary: >-
          The cheap Beeb: 16K of memory, no printer or analogue ports fitted, and the
          expectation that a school would upgrade it later. Most were, which is why the
          Model A is markedly scarcer than the B despite being sold alongside it — an
          unmodified one, with the empty sockets still empty, is the find. Otherwise
          identical hardware, so it demonstrates Acorn's design intent: one board, sold
          at two prices, with the difference in what is fitted.
        year: 1981
        cpu: Rockwell 6502A-2
        chassis: 'beige case, cream keys'
        os: Acorn MOS 1.20
        ram: [16K]
        issues: [Issue 1, Issue 2, Issue 3, Issue 4, Issue 7]
        styles: [Model A]
      - key: bbc-model-b
        model: BBC Micro Model B
        summary: >-
          The machine the BBC's Computer Literacy Project was built around, and so the
          one a generation of British children learned on. Acorn's engineering is the
          draw: a 6502 clocked properly, four-channel sound, seven display modes and an
          expansion bus that made it the standard laboratory and school controller for a
          decade. Collectors watch for the Ferranti ULAs, which fail and take the
          display with them, and for the 8271 floppy controller of an early board.
        year: 1981
        cpu: Rockwell 6502A-2
        chassis: 'beige case, cream keys'
        os: Acorn MOS 1.20
        ram: [32K]
        issues: [Issue 1, Issue 2, Issue 3, Issue 4, Issue 7]
        styles: [Model B, Model A upgraded to B]
      - key: bbc-b-plus
        model: BBC Micro Model B+
        summary: >-
          Acorn's stopgap between the Model B and the Master: 64K or 128K of memory with
          shadow RAM for the screen, freeing space that the B could not spare, and the
          1770 floppy controller as standard. Sold mainly into schools already committed
          to the platform, and unloved at the time for being neither one thing nor the
          other. That makes it uncommon now, and it runs a body of later software that
          will not fit a Model B.
        year: 1985
        cpu: Rockwell 6512A-2
        chassis: 'beige case, cream keys'
        os: Acorn MOS 2.00
        ram: [64K, 128K]
        issues: []
        styles: [B+ 64K, B+ 128K]
      - key: acorn-electron
        model: Electron
        summary: >-
          Acorn's cut-down Beeb for the home: one custom ULA doing the work of the Model
          B's several, which halved the cost and roughly halved the speed. It arrived to
          enormous demand at Christmas 1983 and Acorn could not build them, a failure
          that cost the company its independence. As hardware it is a neat piece of
          integration; as history it is the machine that broke Acorn, and the ULA is the
          part that fails.
        year: 1983
        cpu: Rockwell 6502A-2
        chassis: compact beige wedge
        os: Acorn OS 1.00
        ram: [32K]
        issues: [Issue 4, Issue 6]
        styles: [Electron]
        chips:
          - socket: cpu
            variants: [Rockwell R6502A, Synertek SY6502A]
          - socket: ula
            label: ULA
            note: >-
              video, memory and cassette in one chip that runs hot and is the usual
              reason a dead Electron is dead
            variants: [Ferranti 12C021, Ferranti 12C021A]
          - socket: os-rom
            variants: [OS 1.00]
          - socket: basic-rom
            variants: [BASIC II]
          - socket: video-ula
            variants: []
          - socket: serial-ula
            variants: []
          - socket: crtc
            variants: []
          - socket: fdc
            variants: []
      - key: acorn-risc-pc
        model: Risc PC 600
        summary: >-
          Acorn's answer to the PC: a stackable "slice" case you could add height to,
          two processor sockets, and the option of a genuine 486 card so RISC OS and
          Windows ran on one desk at once. That second socket is the collector's draw,
          along with a case design nobody else attempted. The last Acorn desktop line
          before the company left the computer business.
        year: 1994
        cpu: Acorn ARM610-30
        chassis: stackable two-slice desktop
        os: RISC OS 3.50
        ram: [4MiB, 8MiB, 16MiB]
        issues: []
        styles: [Risc PC 600, Risc PC 700, Risc PC (three slices)]
        chips:
          - socket: cpu
            note: >-
              on a card of its own, and the reason a Risc PC can carry a 486 beside
              the ARM and run both
