          - socket: gate-array
            label: ASIC
            variants: [Amstrad NC100 ASIC]
          - socket: crtc
            variants: []
          - socket: psg
            variants: []
          - socket: ppi
            variants: []
      - key: amstrad-nc200
        model: NC200 Notebook
        summary: >-
          The NC100 with a sixteen-line backlit screen and a 3.5-inch floppy drive,
