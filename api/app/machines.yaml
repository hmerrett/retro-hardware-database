  - key: sinclair
    name: Sinclair ZX
    manufacturer: Sinclair
    regions: [PAL (UK/Europe), NTSC (Timex/US)]
    chips:
      - socket: cpu
        label: CPU
        note: >-
          four foundries made it and Sinclair bought from whoever was cheapest;
          nothing but the marking changes
        variants: z80
      - socket: ula
        label: ULA
        note: >-
          the heart of the machine and the part that kills it: the number under
          the heatsink is worth writing down before it is needed
        variants:
          - Ferranti 5C102E
          - Ferranti 5C112E
          - Ferranti 6C001E-5
          - Ferranti 6C001E-6
          - Ferranti 6C001E-7
          - Ferranti 7K010E-5
    models:
      - key: sinclair-ql
        model: QL
        summary: >-
          Sinclair's business machine, and one of the great might-have-beens. A 68008
          with proper multitasking, a genuinely advanced BASIC, and Psion's office
          software — announced before it worked, shipped with a dongle hanging out of
          the back, and hobbled by the Microdrive tape loops nobody could make reliable.
          Linus Torvalds learned on one. It killed Sinclair's credibility in business
          and is now a serious collector's machine.
        year: 1984
        cpu: Motorola 68008-7.5
        chassis: black wedge with two Microdrives
        os: Sinclair QDOS
        ram: [128K, 640K]
        issues: [Issue 5, Issue 6, Issue 7]
        styles: [QL, QL with the kludge board]
        chips:
          - socket: cpu
            variants: [Motorola MC68008, Motorola MC68008P8]
          - socket: ula
            label: ZX8301
            note: >-
              the display and the memory timing; the QL has two Sinclair ULAs
              rather than the Spectrum's one, and this is the one that runs hot
            variants: [Sinclair ZX8301]
          - socket: zx8302
            label: ZX8302
            note: the Microdrives, the serial ports, the network and the clock
            variants: [Sinclair ZX8302]
          - socket: ipc
            label: IPC
            note: the second processor that scans the keyboard and makes the sound
            variants: [Intel 8049, NEC D8049]
          - socket: rom
            label: ROM
            note: >-
              the QL shipped before its ROM was finished, so which one a machine
              has is the first thing to look at: FB and PM are the early ones, JM
              the common one, and JS and MG the versions with the bugs out
            variants: [FB, PM, AH, JM, JS, MG (later, multilingual)]
      - key: zx80
        model: ZX80
        summary: >-
          The first computer in Britain to cost under a hundred pounds. Sinclair got
          there by leaving things out: the processor generates the video itself, so the
          screen goes blank whenever the machine computes, and there is 1K of memory and
          a touch-sensitive membrane keyboard. Crude by any measure and enormously
          important — it put a computer in ordinary British homes a year before anyone
          else tried. The white case yellows badly.
        year: 1980
        cpu: NEC D780C-3.25
        chassis: 'white wedge, membrane keyboard'
        os: 4K ZX80 BASIC ROM
        ram: [1K, 16K]
        issues: []
        styles: [membrane keyboard]
        chips:
          - socket: ula
            note: >-
              there isn't one -- the ZX80 does it in TTL, which is why the board is so
              busy
            variants: []
      - key: zx81
        model: ZX81
        summary: >-
          The ZX80 reduced to one ULA and sold by mail order in kit or built form, and
          the machine that made home computing a mass British hobby — around a million
          and a half were sold. 1K of RAM, a wobbly 16K expansion that crashed if you
          breathed on it, and a display that flickers when it thinks. The black wedge is
          one of the most recognisable objects in computing.
        year: 1981
        cpu: NEC D780C-3.25
        chassis: 'black wedge, membrane keyboard'
        os: 8K ZX81 BASIC ROM
        ram: [1K, 16K]
        issues: [Issue 1, Issue 3]
        styles: [membrane keyboard, Timex Sinclair 1000]
        chips:
          - socket: ula
            note: >-
              the one chip that made a ZX81 out of a ZX80's worth of TTL
            variants: [Ferranti 2C158E, Ferranti 2C184E]
      - key: zx-spectrum-16k
        model: ZX Spectrum 16K
        summary: >-
          The cheap Spectrum, and the one that shows what Sinclair's colour machine was
          really for: 16K was not enough for the games that made the platform, and most
          buyers either upgraded or replaced it within a year. Surviving unmodified 16K
          Issue 1 and 2 boards are the interesting ones — a genuinely original example
          is considerably scarcer than the 48K it sat beside.
        year: 1982
        cpu: Zilog Z80A-3.5
        chassis: 'wedge, rubber keys'
        os: Sinclair BASIC (48K ROM)
        ram: [16K]
        issues: [Issue 1, Issue 2, Issue 3, Issue 3B]
        styles: [rubber keys]
      - key: zx-spectrum-48k
        model: ZX Spectrum 48K
        summary: >-
          The machine that defined British gaming. Colour, sound and 48K for £175 in
          1982, and a software industry — Ultimate, Ocean, Imagine — that grew up around
          it in bedrooms. The rubber keys and the attribute-clash colour are as famous
          as anything about it. Issue numbers matter to collectors, the early boards
          being both rarer and more failure-prone, and the ULA is the part that dies.
        year: 1982
        cpu: Zilog Z80A-3.5
        chassis: 'wedge, rubber keys'
        os: Sinclair BASIC (48K ROM)
        ram: [48K, 16K]
        issues: [Issue 1, Issue 2, Issue 3, Issue 3B, Issue 4A, Issue 4B, Issue 5, Issue 6A]
        styles: [rubber keys, 16K board upgraded to 48K]
      - key: zx-spectrum-128
        model: ZX Spectrum 128
        summary: >-
          128K, banked memory, and the AY sound chip that finally gave the Spectrum real
          music — the difference in a game's soundtrack between 48K and 128K is
          startling. Developed with Investrónica for the Spanish market and sold in
          Britain with an external heatsink so large it was nicknamed the toastrack. The
          last machine Sinclair sold under his own control, and uncommon in that form.
        year: 1986
        cpu: Zilog Z80A-3.5
        chassis: wedge with heatsink (toastrack)
        os: 128 BASIC / 48 BASIC
        ram: [128K]
        issues: []
        styles: [toastrack, Spanish 128 (Investronica)]
        chips:
          - socket: psg
            label: Sound
            note: >-
              the three-channel chip that is the whole reason a 128 sounds like a 128
            variants: ay
      - key: zx-spectrum-plus2
        model: ZX Spectrum +2
        summary: >-
          Amstrad's first Spectrum after buying the name: the 128 with a tape deck built
          in, a grey case and a proper keyboard. Cheaper to make and much easier to live
          with, and it kept the AY sound. Purists dislike the Amstrad-era machines;
          practically, this is the easiest classic Spectrum to actually use, and the
          integrated Datacorder is the part that needs its belt.
        manufacturer: Amstrad
        year: 1986
        cpu: Zilog Z80A-3.5
        chassis: 'grey case, built-in tape'
        os: 128 BASIC / 48 BASIC
        ram: [128K]
        issues: []
        styles: [grey case]
        chips:
          - socket: psg
            label: Sound
            variants: ay
      - key: zx-spectrum-plus2a
        model: ZX Spectrum +2A
        summary: >-
          The +3 board with the disc drive replaced by a tape deck, in the +2's black
          case. That means it carries the +3's revised ROM and its compatibility
          problems without the drive that justified them, which is why it is the least
          loved Spectrum. Easily confused with the +2 and worth telling apart: the black
          case and the +2A badge are the tell.
        manufacturer: Amstrad
        year: 1987
        cpu: Zilog Z80A-3.5
        chassis: 'black case, built-in tape'
        os: 128 BASIC / +3 BASIC
        ram: [128K]
        issues: []
        styles: [black case, +2B (later production)]
        chips:
          - socket: ula
            label: ASIC
            note: >-
              Amstrad's gate array, which does the ULA's job and the memory decoding
              with it
            variants: [Amstrad 40056]
          - socket: psg
            label: Sound
            variants: ay
      - key: zx-spectrum-plus2b
        model: ZX Spectrum +2B
        summary: >-
          The last Spectrum. A +2A with the power and video circuitry revised after
          Amstrad moved production, and the final machine to carry the name before the
          line was discontinued in 1990. Externally identical to a +2A, so the board
          markings are the only way to be sure which one is in front of you. The end of
          eight years and five million machines.
        manufacturer: Amstrad
        year: 1988
        cpu: Zilog Z80A-3.5
        chassis: grey case, built-in tape
        os: 128 BASIC / 48 BASIC
        ram: [128K]
        issues: []
        styles: [+2B (grey), +2B (black)]
        chips:
          - socket: ula
            label: ASIC
            variants: [Amstrad 40056]
          - socket: psg
            label: Sound
            variants: ay
      - key: zx-spectrum-plus3
        model: ZX Spectrum +3
        summary: >-
          The Spectrum with a 3-inch disc drive — Amstrad's own drive, from the CPC —
          and the most capable machine of the line. The ROM changes for the disc
          interface broke compatibility with a slice of the earlier software, which is
          the trade. Comparatively uncommon, and the drive and its perishing belt are
          the reason most surviving examples do not work.
        manufacturer: Amstrad
        year: 1987
        cpu: Zilog Z80A-3.5
        chassis: 'black case, built-in 3" floppy'
        os: +3 BASIC / +3DOS / CP/M
        ram: [128K]
        issues: []
        styles: [black case, +3B (later production)]
        chips:
          - socket: ula
            label: ASIC
            variants: [Amstrad 40056]
          - socket: psg
            label: Sound
            variants: ay
          - socket: fdc
            label: Floppy controller
            variants: [NEC D765AC, UMC UM8272A]
          - socket: rom
            label: ROM
            note: >-
              v4.1 fixed the bugs v4.0 shipped with; a machine can have either
            variants: [v4.0, v4.1]
      - key: zx-spectrum-plus
        model: ZX Spectrum+
        summary: >-
          Sinclair's attempt to make the Spectrum look serious: an injected-moulded case
          with proper moulded keys, a reset button and a bigger footprint, wrapped round
          an unchanged 48K board. Widely disliked at the time for the keyboard's
          vagueness, but it is the same machine underneath and considerably nicer to
          type on than the rubber mat. The last Spectrum Sinclair designed before
          selling the company.
        year: 1984
        cpu: Zilog Z80A-3.5
        chassis: 'wedge, moulded keys'
        os: Sinclair BASIC (48K ROM)
        ram: [48K]
        issues: [Issue 4A, Issue 4B, Issue 6A]
        styles: [moulded keys, rubber-key machine in a + case]

