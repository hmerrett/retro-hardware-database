          - socket: gate-array
            label: ASIC
            variants: [Amstrad NC200 ASIC]
          - socket: crtc
            variants: []
          - socket: psg
            variants: []
          - socket: ppi
            variants: []
          - socket: fdc
            label: Floppy controller
            variants: [NEC D765A]
      - key: pcw-8256
        model: PCW 8256
        summary: >-
          Not a home computer but a word processor that happened to be one. Amstrad sold
