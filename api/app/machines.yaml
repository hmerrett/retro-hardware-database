        ram: [128K]
        issues: []
        styles: [grey case (UK), white case (Europe)]
        chips:
          - socket: fdc
            label: Floppy controller
            variants: [NEC D765AC]
      - key: gx4000
        model: GX4000
        summary: >-
          Amstrad's console: the Plus chipset with the keyboard and tape deck taken
          away, launched in 1990 against the Mega Drive and the Super Famicom with 8-bit
          hardware and a catalogue of about thirty games, several of which were CPC
          ports on a cartridge. It failed almost immediately and was cleared at knock-
          down prices. A famous commercial disaster, and cheap for what is genuinely
          capable hardware.
        year: 1990
        cpu: Zilog Z80A-4
        chassis: console
        os: cartridge only
        ram: [64K]
        issues: []
        styles: [GX4000]
        chips:
          - socket: cpu
            variants: z80
          - socket: gate-array
            label: ASIC
            variants: [Amstrad 40489]
          - socket: psg
            variants: ay
          - socket: crtc
            variants: []
      - key: amstrad-nc100
        model: NC100 Notepad
        summary: >-
          A Z80 notepad the size of a hardback: an eight-line screen, a full-travel
          keyboard, PCMCIA memory cards, and batteries that lasted weeks because there
          was nothing in it to drain them. Sold as a writer's machine and still used as
          one — there is an active following, and the serial port means text actually
          gets off it. One of Amstrad's genuinely well-judged products.
        year: 1992
        cpu: Zilog Z80-4.6
        chassis: A4 notepad with an 8-line LCD
        os: BASIC and the built-in organiser, in ROM
        ram: [64K]
        issues: []
