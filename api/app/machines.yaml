    models:
      - key: cpc-464-plus
        model: 464 Plus
        summary: >-
          Amstrad's 1990 revision of the CPC: hardware sprites, scrolling, a proper DMA
          sound engine and a cartridge slot, in a restyled case. Everything the original
          needed to compete, arriving about four years late into a market the Amiga had
          already taken. Backwards compatible with the 464, so it is the best CPC to own
          and the one almost nobody bought.
        year: 1990
        cpu: Zilog Z80A-4
        chassis: 'wedge, built-in tape'
