        summary: >-
          Lighter, smaller and 286-powered: Compaq's second-generation luggable, and
          much the most pleasant of the family to actually handle. It arrived before IBM
          had a credible portable of its own and sold well into business. A good example
          is a genuinely usable AT-class machine.
        year: 1986
        cpu: Intel 80286-8
        chassis: luggable, half the weight of the first one
