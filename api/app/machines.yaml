  - key: amstrad-pc
    name: Amstrad PC
    manufacturer: Amstrad
    regions: [UK, Europe]
    chips:
      - socket: cpu
        label: CPU
        variants: [Intel 8086, NEC V30, Intel 80286, Intel 80386SX]
      - socket: fpu
        label: FPU
        note: >-
          the empty socket next to the processor; empty is the usual answer, and
          worth writing down as such
        variants: [Intel 8087, Intel 80287, Intel 80387SX]
    models:
      - key: amstrad-pc1512
        model: PC1512
        summary: >-
          The machine that broke the price of the PC in Britain. Amstrad sold a complete
          16-bit computer with monitor, mouse and GEM for under £400 in 1986 and took a
          quarter of the European market with it. Everything is subordinate to that
          price: the power supply is in the monitor, so the machine will not run without
          one, and there is no fan — which is why so many died of heat.
        year: 1986
        cpu: Intel 8086-8
        chassis: desktop, with the power supply in the monitor
        os: MS-DOS 3.2 / DOS Plus / GEM
        ram: [512K]
        issues: []
        styles:
          - single drive (SD)
          - twin drive (DD)
          - 10MB disk (HD10)
          - 20MB disk (HD20)
          - Schneider PC1512 (Germany)
        chips:
          - socket: cpu
            variants: [Intel 8086]
          - socket: fpu
            variants: [Intel 8087]
      - key: amstrad-pc1640
        model: PC1640
        summary: >-
          Alan Sugar's answer to the question of why a PC cost two thousand pounds. The
          1640 gave the 1512 proper EGA graphics and 640K as standard, bundled GEM and a
          mouse, and sold in enormous numbers to British small businesses. Everything is
          in service of the price: the power supply lives in the monitor, so the machine
          will not run without one, and the fanless design that Amstrad advertised as
          quiet is the reason so many cooked themselves.
        year: 1987
        cpu: Intel 8086-8
        chassis: desktop, with the power supply in the monitor
        os: MS-DOS 3.2 / GEM
        ram: [640K]
        issues: []
        styles: [single drive (SD), twin drive (DD), 20MB disk (HD20), 30MB disk (HD30)]
        chips:
          - socket: cpu
            variants: [Intel 8086]
          - socket: fpu
            variants: [Intel 8087]
      - key: amstrad-pc2086
        model: PC2086
        summary: >-
          Amstrad's 1988 successor to the 1640, with VGA on the board when VGA was still
          an expensive option elsewhere, and the 3.5-inch drive that the 2000 series
          became notorious for. Still an 8086, so it is slow for its date, but the
          integrated VGA makes it a tidy period machine for DOS graphics. The
          2000-series hard disc problems are the reason to check what is fitted.
        year: 1988
        cpu: Intel 8086-8
        chassis: desktop with a separate power supply and VGA on the board
        os: MS-DOS 3.3 / GEM
        ram: [640K]
        issues: []
        styles: [single drive, 30MB disk]
        chips:
          - socket: cpu
            variants: [Intel 8086]
          - socket: fpu
            variants: [Intel 8087]
      - key: amstrad-pc2286
        model: PC2286
        summary: >-
          Amstrad moving upmarket: a 286 at 12MHz with VGA on the board, aimed at the
          business buyer who had outgrown a 1512. The 2000 series is where Amstrad's
          reputation turned, having shipped with a troubled 3.5-inch drive and a hard
          disk controller that earned the company a famous amount of bad press. That
          history is most of the interest — it is the machine that ended Amstrad's run
          as Britain's volume PC maker.
        year: 1989
        cpu: Intel 80286-12
        chassis: desktop with three expansion slots
        os: MS-DOS 3.3 / GEM
        ram: [1MiB]
        issues: []
        styles: [single drive, 30MB disk, 40MB disk]
        chips:
          - socket: cpu
            variants: [Intel 80286]
          - socket: fpu
            variants: [Intel 80287]
      - key: amstrad-pc2386
        model: PC2386
        summary: >-
          The top of Amstrad's business range: a 386SX with VGA, sold to buyers who had
          outgrown a 1640 and had not yet lost faith in the brand. It is the most
          capable PC Amstrad made in the period and among the least common, the 2000
          series having been overtaken by its own reputation before it sold in volume.
        year: 1989
        cpu: Intel 80386SX-20
        chassis: desktop with VGA and a hard disk as standard
        os: MS-DOS 4 / GEM
        ram: [1MiB, 4MiB]
        issues: []
        styles: [40MB disk, 65MB disk]
        chips:
          - socket: cpu
            variants: [Intel 80386SX]
          - socket: fpu
            variants: [Intel 80387SX]
      - key: amstrad-ppc512
        model: PPC512
        summary: >-
          The first laptop-shaped PC most British buyers ever handled: a full keyboard,
          a supertwist LCD, two floppy drives and ten C-cells, with a modem socket on
          the back. It is not a laptop — it is far too heavy to use on one — but it runs
          for hours on shop batteries and folds shut, which in 1987 was remarkable at
          the price. The screen hinge is the usual break.
        year: 1987
        cpu: NEC V30-8
        chassis: luggable with a fold-up LCD and a handle, run from ten C cells
        os: MS-DOS 3.3
        ram: [512K]
        issues: []
        styles: [one drive, two drives]
        chips:
          - socket: cpu
            variants: [NEC V30]
          - socket: fpu
            variants: [Intel 8087]
      - key: amstrad-ppc640
        model: PPC640
        summary: >-
          The PPC512 with 640K and, in most configurations, an internal modem, which
          made it a genuinely useful machine for a travelling salesman in 1987. Same
          chassis and the same C-cell arrangement. The modem version is the one worth
          having, and the batteries left in the compartment for thirty years are the
          reason to open it before powering it up.
        year: 1987
        cpu: NEC V30-8
        chassis: luggable with a fold-up LCD, a modem and a handle
        os: MS-DOS 3.3
        ram: [640K]
        issues: []
        styles: [one drive, two drives, with modem]
        chips:
          - socket: cpu
            variants: [NEC V30]
          - socket: fpu
            variants: [Intel 8087]

  - key: apple
    name: Apple II
    manufacturer: Apple
    regions: [NTSC (US), PAL (Europe)]
    chips:
      - socket: cpu
        label: CPU
        variants:
          - MOS 6502
          - Synertek SY6502
          - Rockwell R6502
          - NCR 65C02
          - Western Design 65C02
      - socket: rom
        label: Firmware ROM
        note: >-
          socketed on every one of them, and swapped often enough -- for Autostart,
          for the Enhanced set, for a language card -- that what is in there now is
          worth writing down
        variants: [Original Monitor, Autostart Monitor]
    models:
      - key: apple-ii
        model: II
        summary: >-
          The machine that created the personal computer market. Wozniak's design does
          more with fewer chips than anything of its generation — the disc controller
          and the colour graphics are famous pieces of engineering economy — and the
          open slots meant a whole industry grew inside it. VisiCalc, which ran here
          first, is what put computers on office desks. Original 1977 machines with the
          early boards are serious collector's items.
        year: 1977
        cpu: MOS 6502-1.02
        chassis: beige case with a lift-off lid
        os: Integer BASIC
        ram: [4K, 16K, 48K]
        issues: [Revision 0, Revision 1, RFI revision]
        styles: [Apple II]
      - key: apple-ii-plus
        model: II+
        summary: >-
          The II with Applesoft floating-point BASIC in ROM instead of Woz's integer
          version, and autostart, which meant the machine was usable without a manual.
          This is the Apple II that sold in volume through the early eighties and the
          one most surviving software expects. Mechanically and electrically it is a II,
          so it has the same slots and the same repairability.
        year: 1979
        cpu: MOS 6502-1.02
        chassis: beige case with a lift-off lid
        os: Applesoft BASIC / DOS 3.3
        ram: [16K, 32K, 48K]
        issues: []
        styles: [II+, Europlus (Europe), J-Plus (Japan)]
        chips:
          - socket: rom
            variants: [Autostart Monitor]
      - key: apple-iic
        model: IIc
        summary: >-
          Apple's portable II: the whole machine, with a disc drive, in a flat white
          case with a carrying handle and no slots at all. It is the II reduced to a
          sealed appliance, which is either the interesting part or the disappointing
          one depending on what you want from an Apple II. Snow-white industrial design
          by Frogdesign, and the machine that set Apple's look for the rest of the
          decade.
        year: 1984
        cpu: NCR 65C02-1.02
        chassis: compact white case with a built-in drive
        os: Applesoft BASIC / ProDOS
        ram: [128K]
        issues: []
        styles: [IIc, IIc (memory expansion), IIc Plus]
        chips:
          - socket: cpu
            variants: [NCR 65C02, Western Design 65C02]
          - socket: rom
            note: >-
              the four IIc firmware revisions, and what a machine can do with a
              mouse, a second drive or a memory card depends on which it has
            variants: [ROM 255, ROM 0, ROM 3, ROM 4]
      - key: apple-iic-plus
        model: IIc Plus
        summary: >-
          The last Apple II: a 4MHz 65C02, a 3.5-inch drive built in, and an internal
          power supply, in the IIc's case. Substantially faster than any other II and
          the only one with the modern drive as standard, which makes it the most
          practical of the line and the scarcest — it was sold quietly for two years
          while Apple's attention was entirely on the Macintosh.
        year: 1988
        cpu: Western Design 65C02-4
        chassis: compact white case with a 3.5-inch drive
        os: Applesoft BASIC / ProDOS
        ram: [128K]
        issues: []
        styles: [IIc Plus]
        chips:
          - socket: cpu
            variants: [Western Design 65C02]
          - socket: rom
            variants: [IIc Plus ROM]
      - key: apple-iie
        model: IIe
        summary: >-
          The Apple II consolidated: 64K, lower case, a proper keyboard and most of the
          common expansions folded onto the board, with two slots' worth of clutter
          removed. It stayed in Apple's catalogue for eleven years, longer than any
          other model the company has sold, largely because American schools kept buying
          it. The enhanced and platinum revisions are worth telling apart.
        year: 1983
        cpu: MOS 6502-1.02
        chassis: beige case with a lift-off lid
        os: Applesoft BASIC / ProDOS
        ram: [64K, 128K]
        issues: []
        styles: [IIe, IIe Enhanced, IIe Platinum]
        chips:
          - socket: cpu
            variants: [MOS 6502, NCR 65C02 (Enhanced), Synertek SY6502]
          - socket: rom
            note: >-
              which set is in there is what tells an Enhanced IIe from an original
              one, and it is the difference between a machine that runs 128K
              software and one that does not
            variants: [IIe, Enhanced IIe, Platinum IIe]
      - key: apple-iigs
        model: IIgs
        summary: >-
          The Apple II's 16-bit future, and the road Apple did not take. A 65C816 with a
          4096-colour palette and an Ensoniq synthesiser giving thirty-two voices —
          sound hardware years ahead of the Amiga's — while staying compatible with the
          II software library. Apple deliberately clocked it slowly to protect the
          Macintosh, and the machine never got the support it deserved. The battery on
          the board leaks; check before powering up.
        year: 1986
        cpu: Western Design 65C816-2.8
        chassis: platinum desktop with a lift-off lid
        os: GS/OS
        ram: [256K, 1MiB, 4MiB]
        issues: []
        styles: [ROM 00, ROM 01, ROM 3, Woz limited edition]
        chips:
          - socket: cpu
            variants: [Western Design 65C816, GTE G65SC816]
