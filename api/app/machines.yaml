          - socket: fpu
            variants: [Intel 80387]
      - key: compaq-portable-486
        model: Portable 486
        summary: >-
          The last of the line that made Compaq's name. The original 1983 Portable was
          the first successful IBM clone and the machine that proved BIOS could be
          legally reverse-engineered; by 1991 the same lunchbox shape held a 486DX at
          33MHz, which is a remarkable amount of computer to carry by a handle. Heavy,
          superbly engineered, and the end of an idea — laptops had already made the
          luggable obsolete.
