  - key: atari-consoles
    name: Atari consoles
    manufacturer: Atari
    regions: [PAL, NTSC, SECAM]
    models:
      - key: atari-2600
        model: '2600'
        summary: >-
          The console that created the industry. A 6507 with 128 bytes of RAM and no
          frame buffer, so the program has to build the picture a scanline at a time in
          step with the beam — the hardest mainstream machine ever to program, and the
          reason its best games are feats of engineering. It sold thirty million, caused
          the 1983 crash, and every collection starts here.
        year: 1977
        cpu: MOS 6507-1.19
        chassis: console
        os: cartridge only
        ram: []
        issues: []
        styles:
          - heavy sixer
          - light sixer
          - 4-switch woodgrain
          - 4-switch (Vader)
          - 2600 Jr short rainbow
          - 2600 Jr long rainbow
        chips:
          - socket: cpu
            label: CPU
            variants: [MOS 6507, Synertek 6507]
          - socket: tia
            label: TIA
            note: >-
              graphics and sound in one chip, and no frame buffer behind it
            variants: [C010444, C011903]
          - socket: riot
            label: RIOT
            note: >-
              the RAM, the timers and the switch inputs -- all 128 bytes of the
              machine's memory are in here
            variants: [MOS 6532, Synertek 6532]
      - key: atari-5200
        model: '5200'
        summary: >-
          Atari's answer to Intellivision: essentially Atari 400 hardware in a console
          with notoriously bad non-centring analogue controllers, no backwards
          compatibility with the 2600 at launch, and a launch into a collapsing market.
          It lasted two years. The controllers are the reason most surviving examples do
          not really work, and rebuilt ones are a small industry.
        year: 1982
        cpu: MOS 6502C-1.79
        chassis: console with a sloped case
        os: cartridge, with a BIOS
        ram: [16K]
        issues: []
        styles: [5200 (four controller ports), 5200 (two controller ports)]
        chips:
          - socket: cpu
            label: CPU
            note: an 800 in a console case, which is why the games look so familiar
            variants: [MOS 6502C (Sally)]
          - socket: antic
            label: ANTIC
            variants: [C012296]
          - socket: gtia
            label: GTIA
            variants: [C014805, C014889]
          - socket: pokey
            label: POKEY
            variants: [C012294]
      - key: atari-7800
        model: '7800'
        summary: >-
          Designed in 1984, shelved during Atari's sale, and finally released in 1986
          into a market Nintendo already owned. The MARIA chip does far more sprites
          than the 2600 and it plays the whole 2600 library, which makes it the most
          practical classic Atari console. The sound is the weak point — it kept the
          2600's TIA — and the library is thin.
        year: 1986
        cpu: MOS 6502C-1.79
        chassis: console
        os: 'cartridge only, with a BIOS'
        ram: [4K]
        issues: []
        styles: [7800 (1986 production), 7800 with expansion port]
        chips:
          - socket: cpu
            label: CPU
            variants: [MOS 6502C (Sally)]
          - socket: maria
            label: MARIA
            note: >-
              the display chip that made the 7800 a 7800 rather than a faster 2600
            variants: [C300599]
          - socket: tia
            label: TIA
            note: >-
              kept for sound, and for playing 2600 cartridges
            variants: [C011903]
          - socket: pokey
            label: POKEY
            note: >-
              on the cartridge rather than the board, in the handful of games that
              wanted better sound
            variants: [C012294, not fitted]
      - key: atari-jaguar
        model: Jaguar
        summary: >-
          Marketed as the first 64-bit console, which was a stretch: five processors,
          two of them 32-bit RISC, in an architecture so awkward that most developers
          used the 68000 as the main CPU and left the rest idle. It killed Atari as a
          hardware company. The Tempest 2000 soundtrack and the sheer strangeness of the
          design are the reasons to own one.
        year: 1993
        cpu: Motorola 68000-13.3
        chassis: console, black with a numeric keypad controller
        os: cartridge
        ram: [2MiB]
        issues: []
        styles: [Jaguar, Jaguar with the CD unit]
        chips:
          - socket: cpu
            note: >-
              the 68000 is the housekeeper rather than the star; the two custom
              chips beside it are where the "64-bit" on the box came from
            variants: [Motorola MC68000]
          - socket: tom
            label: Tom
            variants: [Atari Tom]
          - socket: jerry
            label: Jerry
            variants: [Atari Jerry]
      - key: atari-lynx
        model: Lynx
        summary: >-
          The first handheld with a colour backlit screen and hardware sprite scaling,
          designed by ex-Amiga engineers and released in 1989 — technically far beyond
          the Game Boy it lost to. It is also large, thirsty for six AA cells, and had
          almost no software. A striking piece of hardware and a clear illustration that
          the better machine does not win.
        year: 1989
        cpu: MOS 65SC02-4
        chassis: handheld with a backlit colour LCD
        os: cartridge
        ram: [64K]
        issues: []
        styles: [Lynx I, Lynx II]
        chips:
          - socket: cpu
            label: CPU
            variants: [MOS 65SC02, Western Design 65SC02]
          - socket: suzy
            label: Suzy
            note: the sprite engine, and the reason a Lynx scales and rotates
            variants: [Atari Suzy]
          - socket: mikey
            label: Mikey
            note: the CPU's housing, the sound, the timers and the LCD
            variants: [Atari Mikey]

  - key: atari-st
    name: Atari ST
    manufacturer: Atari
    regions: [PAL, NTSC]
    chips:
