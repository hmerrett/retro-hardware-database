# The catalogue of machines this register knows as models: home computers,
# consoles, and the branded PCs that were documented well enough to have
# versions of themselves. A whitebox clone is not in here and never will be --
# it is described by the parts in it, which is all there is to say about it.
#
# ---------------------------------------------------------------------------
# ADDING A MACHINE
# ---------------------------------------------------------------------------
#
# You do not need to know any programming to edit this file. It is a list, and
# the only rule that really matters is that things line up: a line's indentation
# is what says which machine it belongs to. Use spaces, never tabs.
#
# Find the family your machine belongs to (Sinclair, Commodore, Sharp, MSX...)
# and copy the model above it as a starting point. If its maker is not here at
# all, copy a whole family instead. Then correct the values.
#
# A model looks like this, and only the first three lines are compulsory:
#
#       - key: oric-atmos          <- the permanent name. See the warning below.
#         model: Atmos             <- what to call it. NOT "Oric Atmos": the
#                                     maker is written separately, so putting it
#                                     here would file the machine as "Oric Oric
#                                     Atmos". The two are joined for you.
#         year: 1984               <- the year that model appeared
#         manufacturer: Oric       <- only if it differs from the family's
#         cpu: MOS 6502A-1         <- maker, part, MHz, the way the CPU box wants
#         chassis: wedge, white case
#         os: Oric Extended BASIC
#         ram: [48K]               <- the sizes it was sold with. Write them as
#                                     16K, 128K, 1MiB; the register reads those
#                                     back, and refuses a size it cannot.
#         issues: [Issue 1]        <- board revisions, as the maker marked them
#         styles: [Atmos]          <- what tells two of them apart across the
#                                     room: rubber or moulded keys, a silver or
#                                     a rainbow label, a heavy sixer
#         chips:                   <- one entry per socket worth recording
#           - socket: psg          <- the permanent name for the socket
#             label: Sound         <- what the page and the form call it. Leave
#                                     it out and the socket name is tidied up
#                                     instead, so 'cpu' shows as 'CPU'.
#             note: >-             <- optional, and shown beside the question.
#               why anyone would care which one is in there
#             variants: [General Instrument AY-3-8912]
#
# Anything you leave out is simply not asked about. Anything you get wrong stops
# the register from starting, and the message says which family, which model and
# which field -- so if the site does not come back up after an edit, read it.
#
# ---------------------------------------------------------------------------
# THE THINGS TO BE CAREFUL ABOUT
# ---------------------------------------------------------------------------
#
# KEYS ARE FOREVER. `key:` is the one thing a real machine's record stores. Every
# other word here -- a name, a label, a note, a chip's part number -- can be
# corrected whenever, and every machine filed under it picks the correction up.
# Change a key and the machines filed under the old one are orphaned, and only a
# database migration puts them back. Pick a key, keep it.
#
# THESE LISTS ARE THE COMMON CASES, NOT AN INVENTORY. Every list here is offered
# as a set of buttons with a "custom" box beside them, so a board nobody has
# written up or a chip swapped in a repair is recorded by typing it. Better
# still, what is typed once is offered ever after: the register adds it to the
# buttons for that model by itself. So there is no need to chase completeness --
# put down what turns up, and let the rest arrive.
#
# ONE THING SAID ONCE. The maker goes in `manufacturer:`, at the family or on the
# model, and never in `model:` as well.
#
# ---------------------------------------------------------------------------
# TWO SHORTCUTS
# ---------------------------------------------------------------------------
#
# SHARED LISTS. Where the same part numbers turn up in machine after machine,
# they are written once under `lists:` at the top and named afterwards:
#
#     variants: z80          instead of the eight Z80 markings written out
#
# You can name a shared list anywhere a list is expected -- variants, styles,
# issues, regions.
#
# A FAMILY'S SOCKETS ARE EVERY MODEL'S. A `chips:` block on the family is asked
# of every model in it, so the Z80 is written once for all the Spectrums. A model
# can then say something different about one socket without repeating the rest:
#
#     chips:
#       - socket: ula
#         variants: [Amstrad 40056]     <- this model has a different part
#       - socket: sid
#         variants: []                  <- this model hasn't got that socket
#
# An empty `variants:` list is how a machine says it has not got one: it is why a
# VIC-20 is not asked about its SID and a ZX80 is not asked about its ULA.
#
# ---------------------------------------------------------------------------
#
# WHERE ORDER MATTERS. Families are offered in alphabetical order of who made
# them, whatever order this file lists them in -- so a new family can go wherever
# is convenient and will still land in the right place in the menu. This file is
# kept in that order too, just so it is easy to read.
#
# A family's machines are sorted by name for the same reason, so one slotted in
# beside the machine you copied still comes out in the right place. Numbers in a
# name count as numbers, so an Amiga 500 comes before an Amiga 1000.
#
# What you write in order stays in order in one place: a model's chip sockets are
# asked as you list them, so put them in the order you read the board.

lists:
  z80:
    - Zilog Z80A
    - Zilog Z8400AB1
    - NEC D780C-1
    - SGS Z8400AB1
    - Sharp LH0080A
    - Mostek MK3880N-4
    - GoldStar Z8400A
    - Toshiba TMPZ84C00AP
  ay:
    - General Instrument AY-3-8912
    - General Instrument AY-3-8910
    - Yamaha YM2149F

