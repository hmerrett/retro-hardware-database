        summary: >-
          The cut-down XL: 16K, no built-in BASIC problems but not enough memory for
          much of the library, and the expectation that you would buy the 1064
          expansion. Most people bought an 800XL instead. Same excellent chipset in a
          smaller case, and the least common of the XL pair.
        year: 1983
        cpu: MOS 6502C-1.79
        chassis: XL wedge
