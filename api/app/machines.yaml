            variants: []
          - socket: psg
            variants: []
          - socket: ppi
            variants: []
      - key: pcw-8512
        model: PCW 8512
        summary: >-
          The PCW with 512K and a second, larger disc drive, for people doing enough
          writing to be swapping discs. Same machine otherwise, and the extra memory
