# The application's dependencies, and the lockfile beside this file pins the whole
# transitive tree rather than the fourteen names below (backend-standards). The
# repository's tooling configuration -- ruff, pytest -- stays in the pyproject at
# the root, because it is about the whole repository and not about this package.
#
# To change a dependency: edit the list here, run `uv lock`, and let the tests and
# pip-audit vouch for the result. To install one: `uv sync --all-groups`, which
# builds .venv from the lock and nothing else.
[project]
name = "retro-hardware-database"
version = "0.1.0"
description = "A self-hosted catalogue for a retro-computer collection"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "SQLAlchemy==2.0.52",
    "PyMySQL==1.2.0",
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    "PyYAML==6.0.3",
    "python-multipart==0.0.32",
    "reportlab==5.0.1",
    "segno==1.6.6",
    "alembic==1.20.0",
    "itsdangerous==2.2.0",
    "httpx==0.28.1",
    "Pillow==12.3.0",
]

# Test and lint tooling, kept out of the runtime image: `uv sync --no-dev` in the
# Dockerfile installs the list above and nothing here. pytest, ruff and mypy are pinned
# so test results, lint rules and type errors do not shift under CI; pip-audit is left to float
# so the scanner stays current.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "pip-audit",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
    "types-reportlab==5.0.0.20260911",
]

# Nothing here is a package to be built and installed -- the app is copied into the
# image and run from /app. Without this, uv would try to build a wheel of it.
[tool.uv]
package = false

# mypy is strict, on every module, with no list of exceptions. There was one -- the
# modules not typed yet, named in an override that could only shrink -- and it is
# gone because it is empty. Do not bring it back for a new module: strict is what a
# new module gets by doing nothing, and that is the point of having finished.
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# The ways out are closed, so that a type error is answered by a type and not by
# silence: no bare `# type: ignore`, none left behind once its error has gone, and
# no `Any` written by hand.
enable_error_code = ["ignore-without-code"]
warn_unused_ignores = true
disallow_any_explicit = true

# The one standing exception, and not a module waiting its turn. Every pydantic
# model trips `disallow_any_explicit` through no `Any` of its own: BaseModel's
# constructor takes `**data: Any`, and mypy reports the class that inherits it.
[[tool.mypy.overrides]]
module = ["app.schemas"]
disallow_any_explicit = false
